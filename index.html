                      <!-- The Popup Form -->
            <div id="formModal" class="modal">
              <div class="modal-content">
                <span class="close">&times;</span>

                <form id="signupForm" action="index.php" method="post">
                  <label for="fname">First Name</label>
                  <input type="text" id="firstname" name="firstname" required placeholder="First Name">

                  <label for="lname">Last Name</label>
                  <input type="text" id="lastname" name="lastname" required placeholder="Last Name">

                  <label for="phone">Phone</label>
                  <input type="text" id="phone" name="phone" required placeholder="(###) ### - ###">

                  <label for="email">Email*</label>
                  <input type="email" id="email" name="email" required placeholder="example@domain.com"><br><br><br>

                  <label for="options">Areas of interest (Select all that apply)</label><br>
                  <input type="checkbox" id="adultsjj" name="adultsJiuJitsu">
                  <label for="adultsjj">Adult Jiu Jitsu</label><br>

                  <input type="checkbox" id="teensjj" name="teensJiuJitsu">
                  <label for="teensjj">Teen Jiu Jitsu (age 14+)</label><br>

                  <input type="checkbox" id="kidsjj" name="kidsJiuJitsu">
                  <label for="kidsjj">Kids Jiu Jitsu (age 7 - 13)</label><br>

                  <input type="checkbox" id="youngjj" name="youngJiuJitsu">
                  <label for="youngjj">Youngsters Jiu Jitsu (age 3-6)</label><br>

                  <input type="checkbox" id="mma" name="MMA">
                  <label for="mma">Intro to MMA</label><br>

                  <input type="checkbox" id="boxing" name="Boxing">
                  <label for="boxing">Adult & Teen Boxing</label><br>

                  <input type="checkbox" id="bombo" name="Sombo">
                  <label for="sombo">Sombo</label><br><br>

                  <label for="subject">Voice your concerns and questions below...</label>
                  <textarea id="subject" name="subject" placeholder="Ask us anything!"></textarea>

                  <input type="checkbox" id="sms" name="SMS">
                  <label for="sms">I Consent to Receive SMS Notifications...</label><br><br>

                  <input type="checkbox" id="marketing" name="Marketing">
                  <label for="marketing">I agree to receive Marketing and Promotional messages...</label><br><br>

                  <input type="submit" value="Submit">
                </form>

                <!-- Confirmation message -->
                <div id="confirmation" style="display:none; margin-top:15px; font-weight:bold;"></div>
              </div>
            </div>

            <!-- JAVASCRIPT for form -->
            <script>
              document.addEventListener("DOMContentLoaded", function() {
                const modal = document.getElementById("formModal");
                const openBtn = document.getElementById("openFormBtn");
                const closeBtn = document.querySelector(".close");

                // Open modal (prevent <a> from navigating)
                openBtn.onclick = (e) => {
                  e.preventDefault();
                  modal.style.display = "block";
                  openBtn.style.display = "none"; // hide button while modal is open
                };

                // Close modal via ×
                closeBtn.onclick = () => {
                  modal.style.display = "none";
                  openBtn.style.display = "inline-block"; // show button again
                };

                // Close modal by clicking outside
                window.onclick = (e) => {
                  if (e.target == modal) {
                    modal.style.display = "none";
                    openBtn.style.display = "inline-block"; // show button again
                  }
                };
              });
              </script>
