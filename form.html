<!DOCTYPE html>
<html>
<head>
  <title>Form</title>
</head>
  <body>
    <form id="signupForm" action="process.php" method="POST">
      <label for="fname">First Name</label>
      <input type="text" id="firstname" name="firstname" required placeholder="First Name">

    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" name="lastname" required placeholder="Last Name">

      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" required placeholder="(###) ### - ####">

      <label for="email">Email*</label>
      <input type="email" id="email" name="email" required placeholder="example@domain.com"><br><br><br>

      <label for="options">Areas of interest (Select all that apply)</label><br>
      <input type="checkbox" id="adultsjj" name="adultsjiujitsu" value="1">
      <label for="adultsjj">Adult Jiu Jitsu</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="teensjj" name="teensjiujitsu" value="1">
      <label for="teensjj">Teen Jiu Jitsu (age 14+)</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="kidsjj" name="kidsjiujitsu" value="1">
      <label for="kidsjj">Kids Jiu Jitsu (age 7 - 13)</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="youngjj" name="youngjiujitsu" value="1">
      <label for="youngjj">Youngsters Jiu Jitsu (age 3-6)</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="mma" name="mma" value="1">
      <label for="mma">Intro to MMA</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="boxing" name="boxing" value="1">
      <label for="boxing">Adult & Teen Boxing</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="sombo" name="sombo" value="1">
      <label for="sombo">Sombo</label><br><br>

      <label for="subject">Voice your concerns and questions below...</label>
      <textarea id="subject" name="subject" placeholder="Ask us anything!"></textarea>

      <input type="checkbox" id="sms" name="sms" value="1">
      <label for="sms">I Consent to Receive SMS Notifications...</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="marketing" name="marketing" value="1">
      <label for="marketing">I agree to receive Marketing and Promotional messages...</label><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
