      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    input[type="submit"] {
      padding: 12px 20px;
      background: #0074ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

    input[type="submit"]:hover {
      background: #005fcc;
    }
  </style>
</head>
